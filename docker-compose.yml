services:
  postgres:
    image: postgres:16-alpine
    container_name: safe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: safe_user
      POSTGRES_PASSWORD: safe_secure_password_123
      POSTGRES_DB: safe_humanitarian_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safe_user -d safe_humanitarian_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: safe-server
    restart: unless-stopped
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://safe_user:safe_secure_password_123@postgres:5432/safe_humanitarian_db
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - voice_uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: safe-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data:
  voice_uploads:

