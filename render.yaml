services:
  # Unified Full-Stack Service (React PWA + Ingestion API Engine)
  - type: web
    name: project-safe-server
    env: node
    plan: free
    buildCommand: npm --prefix client install --include=dev && npm --prefix client run build && npm --prefix server install --include=dev && npm --prefix server run build
    startCommand: npm --prefix server start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: project-safe-db
          property: connectionString

databases:
  # PostgreSQL Managed Database
  - name: project-safe-db
    plan: free
    databaseName: safe_humanitarian_db
    user: safe_user
